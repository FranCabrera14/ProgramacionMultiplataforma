<ion-header [translucent]="true" >
  <ion-toolbar color = "dark">
    <ion-button slot="start"  color="dark">
      <ion-back-button defaultHref="/restaurante"></ion-back-button>
    </ion-button>
    <ion-title class="ion-text-center" >{{mirestaurante.nombre}}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" >
  <div style="background-color:rgb(99, 18, 16);">
  <ion-grid>
    <ion-row>
      <ion-col>
        <ion-img [src]="mirestaurante.logotipo"></ion-img>
      </ion-col>
    </ion-row>
    <ion-row >
      <ion-col>
        <ion-row>
          <h3>Número de tenedores:</h3>
        </ion-row>
      </ion-col>
      <ion-col  style="display: flex; align-items: center;">
          <ion-row *ngFor="let _ of [].constructor(mirestaurante.numTenedores)" style="align-items: center; width: 10%;">
            <ion-img src="../../assets/6c7ee71c-3f50-470b-b8dd-e9e2c2a6f0c9-removebg-preview.png" ></ion-img>
          </ion-row>
      </ion-col>
      <ion-row>
      <ion-col>
        <ion-list *ngIf="mirestaurante.comentarios != undefined && mirestaurante.comentarios.length > 0; else pepe">
          <ion-item *ngFor="let comment of mirestaurante.comentarios">
            {{mirestaurante.comentarios}}
          </ion-item>
        </ion-list>
        <ng-template #pepe>
          <p class="ion-text-center">hola</p>
        </ng-template>
      </ion-col>
    </ion-row>
  </ion-row>
  </ion-grid>
</div>
</ion-content>
